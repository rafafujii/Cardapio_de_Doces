<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="50%" stop-color="#2D080E" />
      <stop offset="100%" stop-color="#1A0408" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B5" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#7B5B00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Decorative Golden Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85" />

  <!-- Central Brand Motif: Gourmet Sweet / Brigadeiro Dome -->
  <g transform="translate(256, 230)">
    <!-- Plate / Base Liner -->
    <path d="M-90,65 L-70,105 L70,105 L90,65 Z" fill="#2A070D" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Fluted Paper Cup Lines -->
    <path d="M-50,65 L-40,105 M-15,65 L-10,105 M15,65 L10,105 M50,65 L40,105" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7" />

    <!-- Gourmet Brigadeiro Ball -->
    <ellipse cx="0" cy="40" rx="95" ry="85" fill="#3D0B13" stroke="url(#goldGrad)" stroke-width="3.5" />
    
    <!-- Sprinkles / Confeitos Dourados -->
    <circle cx="-40" cy="15" r="4" fill="url(#goldGrad)" />
    <circle cx="25" cy="5" r="3.5" fill="url(#goldGrad)" />
    <circle cx="-10" cy="45" r="4" fill="url(#goldGrad)" />
    <circle cx="50" cy="35" r="4" fill="url(#goldGrad)" />
    <circle cx="-55" cy="50" r="3" fill="url(#goldGrad)" />
    <circle cx="10" cy="20" r="3.5" fill="url(#goldGrad)" />
    <circle cx="40" cy="60" r="3" fill="url(#goldGrad)" />

    <!-- Crown / Sparkle at Top -->
    <path d="M0,-35 L8,-15 L28,-22 L15,-5 L30,10 L10,8 L0,25 L-10,8 L-30,10 L-15,-5 L-28,-22 L-8,-15 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  </g>

  <!-- Typography: S.E DOCES GOURMET -->
  <text x="256" y="380" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    S.E DOCES
  </text>
  <text x="256" y="415" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#EAD59A" text-anchor="middle" letter-spacing="6" opacity="0.9">
    GOURMET
  </text>
</svg>
